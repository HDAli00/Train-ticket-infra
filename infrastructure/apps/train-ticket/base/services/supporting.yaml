# Java microservices: assurance (18888), notification (17853), news (12862), avatar (17001)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-assurance-service
  labels: {app: ts-assurance-service, component: service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ts-assurance-service}
  template:
    metadata:
      labels: {app: ts-assurance-service}
    spec:
      containers:
        - name: ts-assurance-service
          image: hdali00/ts-assurance-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 18888
          env:
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef: {name: java-opts, key: JAVA_OPTS}
          readinessProbe:
            tcpSocket: {port: 18888}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits:  {memory: "512Mi", cpu: "500m"}
---
apiVersion: v1
kind: Service
metadata:
  name: ts-assurance-service
spec:
  selector: {app: ts-assurance-service}
  ports:
    - {port: 18888, name: http}
