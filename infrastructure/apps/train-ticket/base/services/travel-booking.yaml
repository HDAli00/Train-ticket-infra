# Java microservices: travel (12346), travel2 (16346), preserve (14568), preserve-other (14569),
# seat (18898), travel-plan (14322), route-plan (14578), price (16579), contacts (12347)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-travel-service
  labels: {app: ts-travel-service, component: service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ts-travel-service}
  template:
    metadata:
      labels: {app: ts-travel-service}
    spec:
      containers:
        - name: ts-travel-service
          image: hdali00/ts-travel-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 12346
          env:
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef: {name: java-opts, key: JAVA_OPTS}
          readinessProbe:
            tcpSocket: {port: 12346}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits:  {memory: "512Mi", cpu: "500m"}
---
apiVersion: v1
kind: Service
metadata:
  name: ts-travel-service
spec:
  selector: {app: ts-travel-service}
  ports:
    - {port: 12346, name: http}
