# Java microservices: auth (12340), user (12342), verification-code (15678), security (11188)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-auth-service
  labels: {app: ts-auth-service, component: service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ts-auth-service}
  template:
    metadata:
      labels: {app: ts-auth-service}
    spec:
      containers:
        - name: ts-auth-service
          image: hdali00/ts-auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 12340
          env:
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef: {name: java-opts, key: JAVA_OPTS}
          readinessProbe:
            tcpSocket: {port: 12340}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits:  {memory: "512Mi", cpu: "500m"}
---
apiVersion: v1
kind: Service
metadata:
  name: ts-auth-service
spec:
  selector: {app: ts-auth-service}
  ports:
    - {port: 12340, name: http}
