# API gateway (18888) and UI dashboard (8080, openresty/nginx)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-gateway-service
  labels: {app: ts-gateway-service, component: gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ts-gateway-service}
  template:
    metadata:
      labels: {app: ts-gateway-service}
    spec:
      containers:
        - name: ts-gateway-service
          image: hdali00/ts-gateway-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 18888
          env:
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef: {name: java-opts, key: JAVA_OPTS}
          readinessProbe:
            tcpSocket: {port: 18888}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits:  {memory: "1Gi", cpu: "500m"}
---
apiVersion: v1
kind: Service
metadata:
  name: ts-gateway-service
spec:
  selector: {app: ts-gateway-service}
  ports:
    - {port: 18888, name: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-ui-dashboard
  labels: {app: ts-ui-dashboard, component: frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ts-ui-dashboard}
  template:
    metadata:
      labels: {app: ts-ui-dashboard}
    spec:
      containers:
        - name: ts-ui-dashboard
          image: hdali00/ts-ui-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {memory: "64Mi", cpu: "50m"}
            limits:  {memory: "128Mi", cpu: "200m"}
---
apiVersion: v1
kind: Service
metadata:
  name: ts-ui-dashboard
spec:
  selector: {app: ts-ui-dashboard}
  ports:
    - {port: 8080, name: http}
