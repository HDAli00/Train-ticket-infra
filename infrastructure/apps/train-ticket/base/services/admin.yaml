# Java microservices: admin-basic-info (18767), admin-order (16112), admin-route (16113),
# admin-travel (16114), admin-user (16115)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-admin-basic-info-service
  labels: {app: ts-admin-basic-info-service, component: service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ts-admin-basic-info-service}
  template:
    metadata:
      labels: {app: ts-admin-basic-info-service}
    spec:
      containers:
        - name: ts-admin-basic-info-service
          image: hdali00/ts-admin-basic-info-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 18767
          env:
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef: {name: java-opts, key: JAVA_OPTS}
          readinessProbe:
            tcpSocket: {port: 18767}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits:  {memory: "512Mi", cpu: "500m"}
---
apiVersion: v1
kind: Service
metadata:
  name: ts-admin-basic-info-service
spec:
  selector: {app: ts-admin-basic-info-service}
  ports:
    - {port: 18767, name: http}
