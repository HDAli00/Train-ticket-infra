# Java microservices: inside-payment (18673), payment (19001), voucher (16101),
# execute (12386), cancel (18885), rebook (18886)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-inside-payment-service
  labels: {app: ts-inside-payment-service, component: service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ts-inside-payment-service}
  template:
    metadata:
      labels: {app: ts-inside-payment-service}
    spec:
      containers:
        - name: ts-inside-payment-service
          image: hdali00/ts-inside-payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 18673
          env:
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef: {name: java-opts, key: JAVA_OPTS}
          readinessProbe:
            tcpSocket: {port: 18673}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits:  {memory: "512Mi", cpu: "500m"}
---
apiVersion: v1
kind: Service
metadata:
  name: ts-inside-payment-service
spec:
  selector: {app: ts-inside-payment-service}
  ports:
    - {port: 18673, name: http}
