# Java microservices: food (18856), food-delivery (18957), station-food (18855),
# train-food (19999), delivery (18808), consign (16111), consign-price (16110)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-food-service
  labels: {app: ts-food-service, component: service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ts-food-service}
  template:
    metadata:
      labels: {app: ts-food-service}
    spec:
      containers:
        - name: ts-food-service
          image: hdali00/ts-food-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 18856
          env:
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef: {name: java-opts, key: JAVA_OPTS}
          readinessProbe:
            tcpSocket: {port: 18856}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits:  {memory: "512Mi", cpu: "500m"}
---
apiVersion: v1
kind: Service
metadata:
  name: ts-food-service
spec:
  selector: {app: ts-food-service}
  ports:
    - {port: 18856, name: http}
