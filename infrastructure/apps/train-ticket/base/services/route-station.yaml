# Java microservices: route (11178), station (12345), train (14567), config (15679), basic (15680)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-route-service
  labels: {app: ts-route-service, component: service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ts-route-service}
  template:
    metadata:
      labels: {app: ts-route-service}
    spec:
      containers:
        - name: ts-route-service
          image: hdali00/ts-route-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 11178
          env:
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef: {name: java-opts, key: JAVA_OPTS}
          readinessProbe:
            tcpSocket: {port: 11178}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits:  {memory: "512Mi", cpu: "500m"}
---
apiVersion: v1
kind: Service
metadata:
  name: ts-route-service
spec:
  selector: {app: ts-route-service}
  ports:
    - {port: 11178, name: http}
