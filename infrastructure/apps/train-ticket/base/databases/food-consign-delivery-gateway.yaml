# MySQL 8.0 StatefulSets: food, consign, consign-price, delivery, food-delivery,
# gateway, station-food, train-food, wait-order
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ts-food-mysql
  labels: {app: ts-food-mysql, component: database}
spec:
  serviceName: ts-food-mysql
  replicas: 1
  selector:
    matchLabels: {app: ts-food-mysql}
  template:
    metadata:
      labels: {app: ts-food-mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4"]
          env:
            - {name: MYSQL_ROOT_PASSWORD, value: "root"}
            - {name: MYSQL_DATABASE, value: "ts"}
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: {memory: "128Mi", cpu: "50m"}
            limits:  {memory: "512Mi", cpu: "300m"}
---
apiVersion: v1
kind: Service
metadata:
  name: ts-food-mysql
spec:
  clusterIP: None
  selector: {app: ts-food-mysql}
  ports:
    - {port: 3306, name: mysql}
